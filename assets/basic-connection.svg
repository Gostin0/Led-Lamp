<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="590" viewBox="0 0 1150 590" role="img" aria-label="ESP8266 NodeMCU WS2812B and microphone wiring">
<rect width="1150" height="590" fill="#07140e"/>
<style>.box{fill:#11251b;stroke:#4ae38b;stroke-width:2}.title{font:700 26px Arial,sans-serif;fill:#e8fff0}.name{font:700 22px Arial,sans-serif;fill:#8bffb4}.pin{font:18px Arial,sans-serif;fill:#e2f6e9}.note{font:16px Arial,sans-serif;fill:#b7d9c2}.p{stroke:#ffcd62;stroke-width:5;fill:none;stroke-linecap:round}.g{stroke:#75daff;stroke-width:5;fill:none;stroke-linecap:round}.d{stroke:#59ff94;stroke-width:5;fill:none;stroke-linecap:round}.m{stroke:#ed98e7;stroke-width:4;fill:none;stroke-linecap:round}</style>
<text x="35" y="42" class="title">GOSTIN LED LAMP — базове підключення</text>
<text x="35" y="70" class="note">ESP8266 NodeMCU • WS2812B • аналоговий мікрофон • живлення 5 V</text>
<rect x="38" y="142" width="232" height="183" rx="14" class="box"/>
<text x="56" y="178" class="name">Блок живлення 5 V</text>
<text x="60" y="216" class="pin">+5V</text><text x="60" y="265" class="pin">GND</text>
<text x="57" y="304" class="note">Струм під кількість LED</text>
<rect x="370" y="125" width="260" height="220" rx="14" class="box"/>
<text x="387" y="160" class="name">ESP8266 / NodeMCU</text>
<text x="390" y="205" class="pin">D4 / GPIO2</text>
<text x="390" y="250" class="pin">GND</text>
<text x="390" y="293" class="pin">A0</text>
<text x="389" y="328" class="note">Живлення через USB*</text>
<rect x="800" y="125" width="310" height="220" rx="14" class="box"/>
<text x="820" y="160" class="name">Стрічка WS2812B</text>
<text x="822" y="205" class="pin">DIN</text>
<text x="822" y="249" class="pin">GND</text>
<text x="822" y="296" class="pin">+5V</text>
<text x="822" y="324" class="note">Вхід першого LED</text>
<rect x="371" y="385" width="259" height="121" rx="14" class="box"/>
<text x="389" y="416" class="name">Мікрофон</text>
<text x="389" y="450" class="pin">OUT → A0</text>
<text x="389" y="479" class="note">GND → GND, VCC → 3V3**</text>
<!-- +5V routed overhead directly to strip -->
<path d="M270 209H300V103H750V294H800" class="p"/>
<text x="550" y="97" class="note">5V напряму на стрічку</text>
<!-- ground rail -->
<path d="M270 260H310V364H756V246H800" class="g"/>
<path d="M370 245H310" class="g"/>
<path d="M500 385V364" class="g"/>
<text x="650" y="357" class="note">Спільна GND</text>
<!-- LED data with inline resistor -->
<path d="M630 200H676" class="d"/>
<rect x="676" y="186" width="72" height="28" rx="6" fill="#1b3929" stroke="#6dffaa" stroke-width="2"/>
<text x="685" y="207" class="note">330Ω</text>
<path d="M748 200H800" class="d"/>
<!-- analog mic -->
<path d="M370 292H338V441H371" class="m"/>
<rect x="35" y="523" width="1075" height="49" rx="12" fill="#17301f" stroke="#2d9153"/>
<text x="50" y="546" class="note">⚠ Не живіть стрічку через ESP. Поставте 1000µF між +5V/GND біля LED; за потреби — 3.3→5V level shifter на DATA.</text>
<text x="50" y="565" class="note">* Живлення NodeMCU згідно з моделлю плати. ** MIC сумісний з 3.3V; A0 не перевищувати: голий ESP8266 0–1V.</text>
</svg>